name: Validate landline audio and UI

on:
  push:
    branches:
      - fix/one-way-microphone-audio
      - feat/landline-ui-overhaul
  pull_request:
    branches:
      - main
      - fix/one-way-microphone-audio

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set preview version above latest public release
        run: |
          sed -i 's/versionCode 1/versionCode 6/' app/build.gradle
          sed -i 's/versionName "1.0.0"/versionName "1.0.6-ui-preview"/' app/build.gradle
      - name: Build debug and signed release test APKs
        run: bash ./gradlew assembleDebug assembleRelease --no-daemon
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-landline-ui-preview-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload signed release test APK
        uses: actions/upload-artifact@v4
        with:
          name: jf-landline-ui-preview-release-test
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
